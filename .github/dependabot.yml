version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      flake-inputs:
        patterns: ["*"]
